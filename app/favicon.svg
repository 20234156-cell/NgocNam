<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="vcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b6e8d"/>
      <stop offset="60%" stop-color="#125d78"/>
      <stop offset="100%" stop-color="#0a394a"/>
    </linearGradient>
    <linearGradient id="vcCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="vcWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e6f2f6"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="vcEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="vcDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#051f28" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle container with glossy rim -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#vcBg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="12.5" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- Left wing of V (Cyan gradient) -->
  <path d="M 14 16 L 24 16 L 32 37 L 24.5 37 Z" fill="url(#vcCyan)"/>

  <!-- Right wing of V (Sleek platinum white with shadow) -->
  <path d="M 50 16 L 40 16 L 28 48 L 36 48 Z" fill="url(#vcWhite)" filter="url(#vcDrop)"/>

  <!-- Trust / Approval Green Shield Badge -->
  <circle cx="45" cy="18" r="6" fill="url(#vcEmerald)" stroke="#ffffff" stroke-width="1.8" filter="url(#vcDrop)"/>
  <path d="M 42.2 18 L 44.2 20 L 48 16" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
